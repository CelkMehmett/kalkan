[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "kalkan"
version = "0.4.0"
description = "Türkçe kişisel verileri LLM'e gitmeden maskeleyen, cevapta geri yükleyen hızlı KVKK motoru (Rust)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["kvkk", "pii", "llm", "turkish", "anonymization", "privacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Natural Language :: Turkish",
  "Natural Language :: English",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
  "Topic :: Text Processing",
]

[project.optional-dependencies]
# Sürüm alt sınırı konmadı; testler litellm 1.110 ve langchain-core 1.7 ile yapıldı.
litellm = ["litellm"]
langchain = ["langchain-core"]

[project.urls]
Homepage = "https://celkmehmett.github.io/kalkan/"
Repository = "https://github.com/CelkMehmett/kalkan"
Documentation = "https://docs.rs/kalkan"
Changelog = "https://github.com/CelkMehmett/kalkan/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "."
module-name = "kalkan._kalkan"
features = []
