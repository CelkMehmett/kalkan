# "v*" etiketi atıldığında:
#   1. Etiket ile Cargo.toml / pyproject.toml sürümlerinin aynı olduğunu doğrular.
#   2. Python tekerleklerini derler (Linux glibc/musl x86_64 + aarch64, macOS Intel +
#      Apple Silicon, Windows x64) ve çalıştırılabilen platformlarda kurup dener.
#   3. Hepsi başarılıysa PyPI'ye ve crates.io'ya yayımlar (ikisi de token'sız,
#      "trusted publishing"), sonra GitHub Release oluşturur.
# Dosya adını değiştirmeyin: PyPI ve crates.io publisher tanımları "wheels.yml" adına bağlı.
name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sürümler etiketle aynı mı?
        shell: bash
        run: |
          v_cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          v_pycargo=$(sed -n 's/^version = "\(.*\)"/\1/p' python/Cargo.toml | head -1)
          v_py=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)
          echo "Cargo.toml=$v_cargo python/Cargo.toml=$v_pycargo pyproject.toml=$v_py"
          test "$v_cargo" = "$v_pycargo" && test "$v_cargo" = "$v_py"
          grep -q "^## \[$v_cargo\]" CHANGELOG.md || { echo "CHANGELOG.md'de $v_cargo bölümü yok"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$v_cargo" || { echo "etiket $GITHUB_REF_NAME, sürüm $v_cargo"; exit 1; }
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos-arm64, os: macos-latest, target: aarch64, test: true }
          - { name: macos-x86_64, os: macos-latest, target: x86_64 }
          - { name: windows-x64, os: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release -m python/Cargo.toml -o dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - name: Tekerleği kur ve dene
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist kalkan
          cd "$RUNNER_TEMP"
          python -c "
          import kalkan
          s = kalkan.Kalkan().session()
          m = s.mask('TC 10000000146, Moda Cad. No:5 Kadıköy/İstanbul')
          assert m == 'TC [TCKN_1], [ADRES_1]', m
          assert s.restore(m) == 'TC 10000000146, Moda Cad. No:5 Kadıköy/İstanbul'
          print(kalkan.__version__, 'tamam')
          "
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m python/Cargo.toml -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    # Tekerlekler de derlendikten sonra: bir platform kırıksa hiçbir yere yayımlanmaz.
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p kalkan
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: [publish, crates]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Sürüm notlarını CHANGELOG.md'den çıkar
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\n---\n`pip install kalkan==%s` · `cargo add kalkan@%s`\n' "$v" "$v" >> notes.md
          cat notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "kalkan $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
