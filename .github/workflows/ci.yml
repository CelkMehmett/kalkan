name: test

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --workspace --exclude kalkan-py
      - run: cargo test --features ffi --lib
      - run: cargo clippy --workspace --all-targets --features ffi -- -D warnings
      - run: cargo doc --no-deps --all-features
      - run: test -f LICENSE-MIT && test -f LICENSE-APACHE

  # Cargo.toml'daki rust-version iddiasını doğrular (Python bağlantısı hariç).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120
      - run: cargo test --lib --tests -p kalkan
      - run: cargo build --features ffi --lib -p kalkan

  # Tekerlekler macOS ve Windows için de derlendiğinden çekirdek orada da sınanır.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p kalkan
      - run: cargo test -p kalkan --features ffi --lib

  python:
    strategy:
      fail-fast: false
      matrix:
        # abi3 tekerleği: en düşük desteklenen ve en güncel sürüm.
        # 3.9 için ubuntu-latest (26.04) imajında hazır Python yok.
        include:
          - { python: "3.9", os: ubuntu-24.04 }
          - { python: "3.13", os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install maturin pytest
      - run: maturin build --release -m python/Cargo.toml -o dist
      - run: pip install dist/*.whl
      # Entegrasyon testleri yalnızca güncel Python'da (3.9'da atlanır, importorskip).
      - if: matrix.python == '3.13'
        run: pip install litellm langchain-core
      - run: pytest -q python/tests

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: cargo build --release --features ffi --lib
      - run: cd wasm && bun install && bun test
