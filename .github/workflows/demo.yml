# WASM'ı derler ve tarayıcı demosunu GitHub Pages'te yayınlar.
# Depo ayarlarında: Settings → Pages → Source: "GitHub Actions".
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get install -y binaryen
      - run: ./wasm/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: wasm/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
